name: Apply existing asteroid art retouch (once)
on:
  push:
    branches: [main]
    paths:
      - "tools/retouch_asteroid_graphics.py"
      - ".github/workflows/one-shot-asteroid-art.yml"
permissions:
  contents: write
jobs:
  recolor-existing-pngs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Modify original PNG artwork in place
        run: python3 tools/retouch_asteroid_graphics.py --apply
      - name: Validate silhouettes, K2SO integration and PNG geometry
        run: |
          python3 tools/test_asteroid_art.py
          python3 tools/smoke.py
          python3 tools/test_k2so_integration.py
      - name: Commit modified original PNGs and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graphics
          git rm .github/workflows/one-shot-asteroid-art.yml
          git diff --cached --check
          git commit -m "feat(assets): retouch 72 original asteroids for K2SO resources"
          git push origin HEAD:main
