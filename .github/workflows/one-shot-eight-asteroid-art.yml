name: Finalize eight-family asteroid artwork (once)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-eight-asteroid-art.yml'
permissions:
  contents: write
jobs:
  apply-original-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image processing dependency for this temporary CI job
        run: python3 -m pip install --quiet pillow
      - name: Edit existing game artwork and derive the two new families
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          from shutil import copyfile
          
          graphics=Path("graphics")
          for old,new in (("chemical","halide"),("crystalline","electrostatic")):
              for size in ("chunk","small","medium","big","huge"):
                  src=graphics/"entity"/"asteroid"/old/size/f"asteroid-{old}-{size}-colour-01.png"
                  dst=graphics/"entity"/"asteroid"/new/size/f"asteroid-{new}-{size}-colour-01.png"
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  copyfile(src,dst)
              names=[f"{old}-asteroid-chunk",f"{old}-asteroid-crushing",f"advanced-{old}-asteroid-crushing"]
              names += [f"{size}-{old}-asteroid" for size in ("small","medium","big","huge")]
              for name in names:
                  copyfile(graphics/"icons"/f"{name}.png", graphics/"icons"/f"{name.replace(old,new)}.png")
          palettes={
              "chemical":((16,44,54),(74,147,144),(194,226,194)),
              "crystalline":((28,36,49),(94,109,121),(199,163,100)),
              "halide":((35,40,76),(102,149,181),(207,220,237)),
              "electrostatic":((25,27,56),(74,95,162),(130,228,213))
          }
          for family,pal in palettes.items():
              paths=list((graphics/"entity"/"asteroid"/family).rglob("*.png"))
              paths+=list((graphics/"icons").glob(f"*{family}-asteroid*.png"))
              paths+=list((graphics/"icons").glob(f"{family}-asteroid*.png"))
              for path in sorted(set(paths)):
                  image=Image.open(path).convert("RGBA")
                  rgba=list(image.getdata())
                  processed=[]
                  for r,g,b,a in rgba:
                      if not a:
                          processed.append((r,g,b,a))
                          continue
                      lum=max(0,min(1,((54*r+183*g+19*b)/(256*255))*1.22))
                      if lum<0.52:
                          low,high,t=pal[0],pal[1],lum/0.52
                      else:
                          low,high,t=pal[1],pal[2],(lum-0.52)/0.48
                      avg=(r+g+b)/3
                      vals=tuple(max(0,min(255,round(low[i]*(1-t)+high[i]*t+(rgb-avg)*0.11)))
                          for i,rgb in enumerate((r,g,b)))
                      processed.append((*vals,a))
                  image.putdata(processed)
                  image.save(path,optimize=True)
              print(f"{family}: {len(set(paths))} existing/original-derived sprites")
          families=("uranium","rock","scrap","organic","chemical","crystalline","halide","electrostatic")
          for family in families:
              for size,n in (("chunk",50),("small",128),("medium",230),("big",304),("huge",512)):
                  p=graphics/"entity"/"asteroid"/family/size/f"asteroid-{family}-{size}-colour-01.png"
                  assert Image.open(p).size==(n,n),p
              icon_names=[f"{family}-asteroid-chunk",f"{family}-asteroid-crushing",
                          f"advanced-{family}-asteroid-crushing"]
              icon_names += [f"{size}-{family}-asteroid" for size in ("small","medium","big","huge")]
              for name in icon_names:
                  p=graphics/"icons"/f"{name}.png"
                  assert Image.open(p).size==(64,64),p
          assert len(list((graphics/"icons").glob("*.png")))==56
          assert len(list((graphics/"entity"/"asteroid").rglob("*.png")))==40
          print("PASS: eight families, 56 icons, 40 complete original-art sprite variants")
          PY
      - name: Check source and portal-safe content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          from zipfile import ZipFile
          m=json.loads(Path("info.json").read_text())
          assert m["version"]=="1.1.0"
          assert "razi_lib >= 1.3.1" in m["dependencies"]
          assert not list(Path(".").rglob("*.py"))
          assert not list(Path(".").rglob("*.sh"))
          assert not list(Path(".").rglob("*.ps1"))
          assert not list(Path(".").rglob("*.bat"))
          print("PASS: version 1.1.0 and forbidden script exclusions")
          PY
      - name: Commit real sprites and delete this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graphics
          git rm .github/workflows/one-shot-eight-asteroid-art.yml
          git diff --cached --check
          git commit -m "feat(assets): complete eight-family original asteroid art"
          git push origin HEAD:main
