[mod-setting-name]
razi-more-asteroids-extended-routes=Populate Space Age asteroid routes
razi-more-asteroids-k2so-recovery=Enable K2SO orbital resource recovery

[mod-setting-description]
razi-more-asteroids-extended-routes=Populate the vanilla Space Age planets and connections with themed resource and hostile asteroids. Existing asteroid records are preserved; other mods own their custom planets and routes.
razi-more-asteroids-k2so-recovery=When Krastorio 2: Spaced Out is installed, unlock eight optional K2SO orbital processing recipes after advanced asteroid processing. Has no effect without K2SO.

[recipe-name]
razi-orbital-rare-metal-recovery=Orbital rare-metal ore extraction
razi-crystalline-ore-leaching=Crystalline ore leaching
razi-orbital-biomass-recovery=Orbital biomass recovery
razi-orbital-mineral-water-recovery=Orbital mineral-water recovery

razi-orbital-scrap-sorting=Orbital scrap component sorting
razi-orbital-hydrogen-recovery=Orbital hydrogen recovery
razi-orbital-oxygen-recovery=Orbital oxygen recovery
razi-orbital-quartz-washing=Orbital quartz washing

[recipe-description]
razi-orbital-rare-metal-recovery=Recover trace K2SO rare-metal ore using rock chunks and acid.
razi-crystalline-ore-leaching=Concentrate crystalline debris into quartz and rare-metal ore using acid.
razi-orbital-biomass-recovery=Recover biomass from organic debris using nutrients.
razi-orbital-mineral-water-recovery=Extract a little K2SO mineral water and sulfur from chemical chunks.

razi-orbital-scrap-sorting=Sort scrap asteroid chunks for trace K2SO electronics and inserter components.
razi-orbital-hydrogen-recovery=Wash chemical asteroid fragments for a modest hydrogen supply.
razi-orbital-oxygen-recovery=Wash chemical asteroid fragments for a modest oxygen supply.
razi-orbital-quartz-washing=Wash crystalline asteroid chunks to recover extra quartz and sand.
