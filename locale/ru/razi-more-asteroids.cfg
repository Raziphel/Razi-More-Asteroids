[mod-setting-name]
razi-more-asteroids-extended-routes=Астероиды на планетах и маршрутах Space Age
razi-more-asteroids-k2so-recovery=Орбитальная добыча ресурсов K2SO

[mod-setting-description]
razi-more-asteroids-extended-routes=Добавляет к планетам и маршрутам Space Age тематические астероиды с ресурсами и опасные астероиды. Уже заданные астероиды остаются; свои планеты и маршруты другие моды настраивают сами.
razi-more-asteroids-k2so-recovery=Если установлен Krastorio 2: Spaced Out, после продвинутой переработки астероидов открываются восемь дополнительных орбитальных рецептов K2SO. Без K2SO ничего не делает.

