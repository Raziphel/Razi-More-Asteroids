[recipe-description]
razi-orbital-rare-metal-recovery=Извлекает руду редких металлов K2SO из кусков тяжелометаллического астероида с помощью кислоты.
razi-crystalline-ore-leaching=Извлекает вольфрам и руду редких металлов K2SO из тяжелометаллических обломков.
razi-orbital-biomass-recovery=Извлекает биомассу из биогенных обломков с помощью питательных веществ.
razi-orbital-mineral-water-recovery=Извлекает минеральную воду K2SO и серу из кусков галогенидного астероида.

razi-orbital-scrap-sorting=Сортирует куски обломочного астероида: немного электронных компонентов и деталей манипуляторов K2SO.
razi-orbital-hydrogen-recovery=Промывка кусков летучего астероида даёт немного водорода.
razi-orbital-oxygen-recovery=Промывка кусков летучего астероида даёт немного кислорода.
razi-orbital-conductor-recovery=Извлекает гольмий и кремний K2SO из кусков электростатического астероида с помощью кислоты.
